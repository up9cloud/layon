on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p layon-agent -p layon-client
      - uses: actions/upload-artifact@v7
        with:
          name: layon-${{ matrix.os }}
          path: |
            target/release/layon-agent
            target/release/layon-agent.exe
            target/release/layon
            target/release/layon.exe
      # Built alone so the client's default features (mdns) stay off, as in the app.
      - name: Build FFI for iOS
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-ios
          cargo build --release -p layon-ffi --target aarch64-apple-ios

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - run: cargo install cargo-ndk --locked
      # x86_64 is for the emulator.
      - run: cargo ndk -t arm64-v8a -t x86_64 build --release -p layon-ffi
