name: ios

on:
  push:
    branches: [master]
    paths: &paths
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - apps/ios/**
      - .github/workflows/ios.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add aarch64-apple-ios
      - run: brew install xcodegen
      - run: apps/ios/build-rust.sh
      - name: Build unsigned ipa
        working-directory: apps/ios
        run: |
          xcodegen generate
          xcodebuild -project Layon.xcodeproj -scheme Layon -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Layon.app Payload/
          zip -qr layon-app-ios.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          path: apps/ios/layon-app-ios.ipa
          archive: false
