name: desktop

on:
  push:
    branches: [master]
    paths: &paths
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
      - .github/workflows/desktop.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      matrix:
        include:
          - { os: windows-latest, label: windows-x64, ext: .exe }
          - { os: windows-11-arm, label: windows-arm64, ext: .exe }
          # musl, statically linked: runs on any distro, no glibc version floor.
          - { os: ubuntu-latest, label: linux-x64, ext: "", target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, label: linux-arm64, ext: "", target: aarch64-unknown-linux-musl }
          - { os: macos-latest, label: macos-arm64, ext: "" }
          # Cross-built on Apple Silicon; the tests run under Rosetta.
          - { os: macos-latest, label: macos-x64, ext: "", target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: matrix.target
        run: rustup target add ${{ matrix.target }}
      # ring compiles C, which needs musl-gcc.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}
      - run: cargo clippy --workspace --all-targets ${{ matrix.target && format('--target {0}', matrix.target) }} -- -D warnings
      - run: cargo test --workspace ${{ matrix.target && format('--target {0}', matrix.target) }}
      - run: cargo build --release -p layon ${{ matrix.target && format('--target {0}', matrix.target) }}
      - name: Name the binary after the device it installs on
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/layon${{ matrix.ext }} dist/layon-${{ matrix.label }}${{ matrix.ext }}
      - uses: actions/upload-artifact@v7
        with:
          path: dist/layon-${{ matrix.label }}${{ matrix.ext }}
          archive: false
