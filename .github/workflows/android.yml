name: android

on:
  push:
    branches: [master]
    paths: &paths
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - apps/android/**
      - .github/workflows/android.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.8.2
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - run: cargo install cargo-ndk --locked
      # Only compile-checked: the Android app runs `layon remote` instead.
      - run: cargo ndk --platform 26 -t arm64-v8a -t x86_64 build --release -p layon-ffi
      - run: apps/android/build-cli.sh
      - working-directory: apps/android
        env:
          LAYON_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LAYON_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - run: cp apps/android/app/build/outputs/apk/release/app-release.apk layon-app-android.apk
      - uses: actions/upload-artifact@v7
        with:
          path: layon-app-android.apk
          archive: false
